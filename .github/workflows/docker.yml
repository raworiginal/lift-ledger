name: Docker

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute image tags
        id: tags
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/lift-ledger
        run: |
          SHA="$(git rev-parse --short=7 HEAD)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            APP_TAG="$VERSION"
            MIGRATE_TAG="migrate-$VERSION"
          else
            APP_TAG="latest"
            MIGRATE_TAG="migrate-latest"
          fi
          {
            echo "app=$IMAGE:$APP_TAG,$IMAGE:sha-$SHA"
            echo "migrate=$IMAGE:$MIGRATE_TAG,$IMAGE:migrate-sha-$SHA"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.app }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.migrate }}
          cache-from: type=gha,scope=builder
          cache-to: type=gha,mode=max,scope=builder

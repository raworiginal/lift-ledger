# Production stack that pulls prebuilt images from Docker Hub.
# Usage: docker compose -f compose.prod.yml pull && docker compose -f compose.prod.yml up -d
# Set IMAGE_TAG in .env to pin a release, e.g. IMAGE_TAG=0.1.0-alpha.1 (default: latest).
services:
  db:
    container_name: "lift-ledger-db"
    image: postgres:17-alpine
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: $POSTGRES_DB
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: raworiginal/lift-ledger:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MIGRATIONS_DATABASE_URL: ""
      NUXT_RUN_STARTUP_TASKS: "true"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
